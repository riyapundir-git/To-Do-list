<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List</h1>

        <!-- Input Section -->
        <div class="input-box">

            <input type="text" id="taskInput" placeholder="Enter your task">

            <button id="addBtn">Add Task</button>

        </div>
        <!-- Search Box -->
        <input type="text" id="searchInput" placeholder="Search task...">

        <!-- Filter Buttons -->
        <div class="filters">

            <button id="allBtn">All</button>

            <button id="completedBtn">Completed</button>

            <button id="pendingBtn">Pending</button>

        </div>

        <!-- Task List -->
        <ul id="taskList">

        </ul>
        <div class="task-Counter">
            <p>Total Tasks:<span id="totalTasks">0</span></p>
            <p>Completed Tasks:<span id="completedTasks">0</span></p>
            <p>Pending Tasks:<span id="pendingTasks">0</span></p>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
